<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="零源机构成员介绍 — 3D翻转卡牌">
    <title>成员介绍 - 零源机构 | Z℮R∅‑SOURCE</title>
    <link rel="stylesheet" href="../css/public.css">
    <link rel="stylesheet" href="../css/font-awesome/css/font-awesome.min.css">
    <link rel="stylesheet" href="../css/cyjs.css">
    <link rel="stylesheet" href="../css/wtfk.css">
    <link href="../css/fonts-google.css" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="../images/cursor/正常选择.cur">
</head>
<body>
<main>
    <!-- 液态头部 -->
    <section class="team-hero">
        <div class="hero-blob t-a"></div>
        <div class="hero-blob t-b"></div>
        <div class="hero-inner">
            <span class="team-badge"><i class="fa fa-id-card-o"></i> TEAM CARDS</span>
            <h1 class="team-title">零源卡牌</h1>
            <p class="team-subtitle">翻转卡牌，认识每一位伙伴</p>
            <div class="team-hint">
                <i class="fa fa-hand-pointer-o"></i>
                <span>点击卡牌翻转查看详情 · 再次点击翻回</span>
            </div>
        </div>
    </section>

    <!-- 3D卡牌网格 -->
    <section class="card-grid-section">
        <div class="card-grid" id="cardGrid">
            <!-- JS 动态生成3D翻转卡牌 -->
        </div>
    </section>

    <!-- 联系信息卡片 -->
    <section class="team-info-section">
        <div class="info-cards">
            <div class="info-card liquid-glass">
                <div class="info-icon icon-pink"><i class="fa fa-map-marker"></i></div>
                <h3>团队坐标</h3>
                <p>晴空万里~</p>
                <p>突然暴风雨~</p>
            </div>
            <div class="info-card liquid-glass">
                <div class="info-icon icon-purple"><i class="fa fa-clock-o"></i></div>
                <h3>运行轨道</h3>
                <p>周一至周五 8:00 - 01:00</p>
                <p>周末 24小时在线</p>
            </div>
            <div class="info-card liquid-glass">
                <div class="info-icon icon-blue"><i class="fa fa-comments"></i></div>
                <h3>信号频道</h3>
                <p>公众号：ZERO零零号</p>
                <p>邮箱：无处躲避总是让人始料不及~</p>
            </div>
        </div>
    </section>
</main>

<script src="../js/cyjs.js"></script>
<script src="../js/public.js"></script>
<script src="../js/wtfk.js"></script>
</body>
</html>
