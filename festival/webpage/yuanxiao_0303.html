<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>元宵节 · 正月十五</title>
    <link rel="stylesheet" href="../css/public.css">
    <link rel="stylesheet" href="../../css/font-awesome/css/font-awesome.min.css">
    <link rel="stylesheet" href="../../css/wtfk.css">
    <link rel="stylesheet" href="../css/yuanxiao_0303.css">
    <link rel="icon" type="image/x-icon" href="../../images/cursor/正常选择.cur">
</head>
<body>
    <canvas id="bgCanvas"></canvas>

    <main class="container">
        <div class="hero">
            <div class="hero-tag liquid-glass">丙午年 · 正月十五</div>
            <h1 class="hero-title">
                <span class="char">花</span><span class="char">好</span><span class="char">月</span><span class="char">圆</span>
            </h1>
            <p class="hero-sub">去年元夜时 · 花市灯如昼</p>
        </div>

        <section class="liquid-glass riddle-section">
            <div class="riddle-header">
                <span class="riddle-icon">🏮</span>
                <h2>猜灯谜</h2>
                <span class="riddle-count" id="riddleCount">1 / 12</span>
            </div>
            <div class="riddle-card" id="riddleCard">
                <p class="riddle-question" id="riddleQuestion">加载中...</p>
                <p class="riddle-answer" id="riddleAnswer" style="display:none;"></p>
            </div>
            <div class="riddle-actions">
                <button class="liquid-btn ghost" id="showAnswerBtn">显示谜底</button>
                <button class="liquid-btn primary" id="nextRiddleBtn">下一题 →</button>
            </div>
        </section>

        <section class="cards-grid">
            <div class="liquid-glass card" data-tilt>
                <div class="card-icon">🥣</div>
                <h3 class="card-title">吃汤圆</h3>
                <p class="card-desc">软糯香甜的汤圆，寓意团团圆圆。一口咬下，满嘴都是幸福的味道。</p>
            </div>
            <div class="liquid-glass card" data-tilt>
                <div class="card-icon">🏮</div>
                <h3 class="card-title">赏花灯</h3>
                <p class="card-desc">大街小巷张灯结彩，各式花灯璀璨夺目，映照出节日的喜庆。</p>
            </div>
            <div class="liquid-glass card" data-tilt>
                <div class="card-icon">🎭</div>
                <h3 class="card-title">猜灯谜</h3>
                <p class="card-desc">灯笼上贴着谜语，猜中有奖。智慧与欢乐并存，是元宵节的传统乐趣。</p>
            </div>
            <div class="liquid-glass card" data-tilt>
                <div class="card-icon">🌕</div>
                <h3 class="card-title">观满月</h3>
                <p class="card-desc">正月十五月儿圆，抬头仰望皎洁明月，寄托对团圆的美好期盼。</p>
            </div>
        </section>

        <section class="blessing-row">
            <div class="liquid-glass blessing-item">
                <span class="b-num">01</span>
                <span class="b-text">团团圆圆</span>
            </div>
            <div class="liquid-glass blessing-item">
                <span class="b-num">02</span>
                <span class="b-text">甜甜蜜蜜</span>
            </div>
            <div class="liquid-glass blessing-item">
                <span class="b-num">03</span>
                <span class="b-text">和和美美</span>
            </div>
        </section>
    </main>

    <script src="../js/yuanxiao_0303.js"></script>
    <script src="../../js/public.js"></script>
    <script src="../../js/wtfk.js"></script>
</body>
</html>
