<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>春节 · 正月初一</title>
    <link rel="stylesheet" href="../css/public.css">
    <link rel="stylesheet" href="../../css/font-awesome/css/font-awesome.min.css">
    <link rel="stylesheet" href="../../css/wtfk.css">
    <link rel="stylesheet" href="../css/chunjie_0217.css">
    <link rel="icon" type="image/x-icon" href="../../images/cursor/正常选择.cur">
</head>
<body>
    <canvas id="bgCanvas"></canvas>

    <main class="container">
        <div class="hero">
            <div class="hero-tag liquid-glass">丙午年 · 正月初一</div>
            <h1 class="hero-title">
                <span class="char">新</span><span class="char">春</span><span class="char">快</span><span class="char">乐</span>
            </h1>
            <p class="hero-sub">爆竹声中一岁除 · 春风送暖入屠苏</p>
        </div>

        <section class="cards-grid">
            <div class="liquid-glass card" data-tilt>
                <div class="card-icon">🧧</div>
                <h3 class="card-title">红包压岁</h3>
                <p class="card-desc">长辈赠予晚辈，寓意辟邪驱鬼，保佑平安。新的一年，福气满满。</p>
            </div>
            <div class="liquid-glass card" data-tilt>
                <div class="card-icon">🎆</div>
                <h3 class="card-title">爆竹迎新</h3>
                <p class="card-desc">噼里啪啦的鞭炮声，炸开新年的喜庆，驱散旧岁的阴霾。</p>
            </div>
            <div class="liquid-glass card" data-tilt>
                <div class="card-icon">🥟</div>
                <h3 class="card-title">团圆年夜饭</h3>
                <p class="card-desc">一家人围坐一桌，热气腾腾的饺子，是最温暖的年味。</p>
            </div>
            <div class="liquid-glass card" data-tilt>
                <div class="card-icon">🏮</div>
                <h3 class="card-title">张灯结彩</h3>
                <p class="card-desc">红灯高挂，春联贴门，处处洋溢着喜庆祥和的节日氛围。</p>
            </div>
        </section>

        <section class="liquid-glass fu-section">
            <div class="fu-card" id="fuCard">
                <div class="fu-front">
                    <span class="fu-text">福</span>
                    <span class="fu-hint">点击翻面</span>
                </div>
                <div class="fu-back">
                    <span class="fu-text">到</span>
                    <span class="fu-hint">福到啦！</span>
                </div>
            </div>
            <div class="fu-words">
                <h2>福到家门</h2>
                <p>倒贴福字，寓意"福到了"。<br>愿新的一年，福气满满，好运连连。</p>
                <button class="liquid-btn primary" id="fireworkBtn">🎇 点我放烟花</button>
            </div>
        </section>

        <section class="blessing-row">
            <div class="liquid-glass blessing-item">
                <span class="b-num">01</span>
                <span class="b-text">岁岁常欢愉</span>
            </div>
            <div class="liquid-glass blessing-item">
                <span class="b-num">02</span>
                <span class="b-text">年年皆胜意</span>
            </div>
            <div class="liquid-glass blessing-item">
                <span class="b-num">03</span>
                <span class="b-text">万事尽可期</span>
            </div>
        </section>
    </main>

    <script src="../js/chunjie_0217.js"></script>
    <script src="../../js/public.js"></script>
    <script src="../../js/wtfk.js"></script>
</body>
</html>
