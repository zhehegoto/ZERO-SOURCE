<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="零源机构 Z℮R∅‑SOURCE — 你所热爱的 就是你的生活">
    <title>零源机构 | Z℮R∅‑SOURCE</title>
    <link rel="stylesheet" href="css/public.css">
    <link rel="stylesheet" href="css/font-awesome/css/font-awesome.min.css">
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/wtfk.css">
    <link href="css/fonts-min.css" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="images/cursor/正常选择.cur">
</head>
<body>
<main>

    <section class="liquid-hero" id="hero">
        <div class="hero-blob blob-a"></div>
        <div class="hero-blob blob-b"></div>
        <div class="hero-blob blob-c"></div>
        <div class="hero-blob blob-d"></div>

        <div class="hero-inner">
            <div class="hero-badge">
                <span class="badge-dot"></span>
                ZERO SOURCE · EST.2025
            </div>
            <h1 class="hero-title">
                <span class="title-line">零源机构</span>
                <span class="title-gradient">Z℮R∅‑SOURCE</span>
            </h1>
            <p class="hero-slogan">你所热爱的 &nbsp;就是你的生活</p>
        </div>

        <div class="hero-scroll-hint">
            <span>SCROLL</span>
            <div class="scroll-track"><div class="scroll-thumb"></div></div>
        </div>
    </section>


    <section class="news-section" id="news">
        <div class="section-head">
            <span class="section-tag">MOMENTS</span>
            <h2 class="section-heading">最新动态</h2>
        </div>
        <div class="news-track" id="newsTrack">

        </div>
        <div class="news-nav">
            <button class="news-nav-btn" id="newsPrev"><i class="fa fa-chevron-left"></i></button>
            <button class="news-nav-btn" id="newsNext"><i class="fa fa-chevron-right"></i></button>
        </div>
    </section>

    <section class="notice-section" id="bottom">
        <div class="section-head">
            <span class="section-tag">NOTICE</span>
            <h2 class="section-heading">站点公告</h2>
        </div>
        <div class="announcement-timeline" id="announcementTimeline">
        </div>

        <button class="history-ann-btn" id="historyAnnBtn">
            <i class="fa fa-history"></i> 历史公告
        </button>
    </section>

    <section class="stats-section-full" id="stats">
        <div class="section-head">
            <span class="section-tag">STATS</span>
            <h2 class="section-heading">零源数据</h2>
        </div>
        <div class="stats-grid">
            <div class="stat-card liquid-glass">
                <div class="stat-icon icon-pink"><i class="fa fa-users"></i></div>
                <div class="stat-number" data-target="5">0</div>
                <div class="stat-label">核心成员</div>
            </div>
            <div class="stat-card liquid-glass">
                <div class="stat-icon icon-purple"><i class="fa fa-camera"></i></div>
                <div class="stat-number" data-target="118">0</div>
                <div class="stat-label">记忆碎片</div>
            </div>
            <div class="stat-card liquid-glass">
                <div class="stat-icon icon-blue"><i class="fa fa-clock-o"></i></div>
                <div class="stat-number" id="runtimeDays" data-target="0">0</div>
                <div class="stat-label">天运行</div>
            </div>
            <div class="stat-card liquid-glass">
                <div class="stat-icon icon-green"><i class="fa fa-infinity"></i></div>
                <div class="stat-number" data-infinity="true">∞</div>
                <div class="stat-label">可能性</div>
            </div>
        </div>
    </section>
</main>

<div class="detail-modal" id="newsModal">
    <div class="modal-backdrop"></div>
    <div class="modal-panel liquid-glass">
        <button class="modal-close" id="newsModalClose">&times;</button>
        <div class="modal-img" id="newsModalImg"></div>
        <div class="modal-body">
            <span class="modal-tag" id="newsModalTag"></span>
            <h3 class="modal-title" id="newsModalTitle"></h3>
            <p class="modal-meta" id="newsModalMeta"></p>
            <div class="modal-content" id="newsModalContent"></div>
        </div>
    </div>
</div>

<div class="detail-modal" id="annModal">
    <div class="modal-backdrop"></div>
    <div class="modal-panel liquid-glass">
        <button class="modal-close" id="annModalClose">&times;</button>
        <div class="modal-body">
            <span class="modal-tag" id="annModalTag"></span>
            <h3 class="modal-title" id="annModalTitle"></h3>
            <p class="modal-meta" id="annModalMeta"></p>
            <div class="modal-content" id="annModalContent"></div>
        </div>
    </div>
</div>

<div class="detail-modal" id="historyModal">
    <div class="modal-backdrop"></div>
    <div class="modal-panel liquid-glass history-panel">
        <button class="modal-close" id="historyModalClose">&times;</button>
        <div class="modal-body">
            <span class="modal-tag">HISTORY</span>
            <h3 class="modal-title">历史公告</h3>
            <div class="history-list" id="historyList">
            </div>
        </div>
    </div>
</div>

<script src="js/index.js"></script>
<script src="js/public.js"></script>
<script src="js/wtfk.js"></script>
</body>
</html>
