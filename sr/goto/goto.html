<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
<title>GOTO - HAPPY BIRTHDAY</title>
    <link rel="stylesheet" href="sr-goto.css">
    <link rel="stylesheet" href="all.min.css">
    <link rel="icon" type="image/x-icon" href="../../images/cursor/正常选择.cur">
</head>
<body>
    <div class="animated-bg"></div>
    <div class="bg-glow"></div>
    <canvas id="particleCanvas"></canvas>
    <canvas id="fireworks-canvas"></canvas>
    <div class="cursor-stars"></div>
    <div class="main-wrapper">
        <div class="hero-birthday animate-in">
            <div class="glow-text-3d">✨ GOTO ✨</div>
            <div class="glow-text-3d sub-title">HAPPY BIRTHDAY</div>
            <div class="subtitle-glow"><i class="fas fa-star"></i> 踏浪而行 · 光芒万丈 <i class="fas fa-meteor"></i></div>
        </div>
        <div class="birthday-card-container animate-in" style="animation-delay: 0.15s;">
            <div class="card-3d" id="flipCard">
                <div class="card-front">
                    <div class="avatar-frame">
                        <i class="fas fa-dragon"></i>
                    </div>
                    <h2>GOTO</h2>
                    <p>✨ 今日主角 ✨</p>
                    <div class="click-hint"><i class="fas fa-hand-point-right"></i> 轻点卡片 · 解锁惊喜 <i class="fas fa-gift"></i></div>
                </div>
                <div class="card-back">
                    <div class="birthday-message" id="typewriterText">🎂 生 日 快 乐 🎂</div>
                    <div class="bless-detail" id="blessTypewriter">
                        愿你的前路如星辰璀璨，步履皆坦途<br>
                        破风前行，不负热爱<br>
                        「Zero · 零号」<br>
                        🎂 永远热烈 永远闪耀 🎂
                    </div>
                    <i class="fas fa-heart pulse-heart" style="font-size: 48px; margin-top: 20px; opacity: 0.9; color: #FFD0E8;"></i>
                </div>
            </div>
        </div>
        <div class="surprise-grid">
            <div class="feature-card">
                <div class="feature-icon"><i class="fas fa-rocket"></i></div>
                <h3>一往无前</h3>
                <p>热爱可抵岁月漫长，前路自有荣光。</p>
            </div>
            <div class="feature-card">
                <div class="feature-icon"><i class="fas fa-brain"></i></div>
                <h3>智行千里</h3>
                <p>每一次抉择，皆为顶峰之路。</p>
            </div>
            <div class="feature-card">
                <div class="feature-icon"><i class="fas fa-chart-line"></i></div>
                <h3>无限进阶</h3>
                <p>天赋与努力兼具，未来无可限量！</p>
            </div>
            <div class="feature-card">
                <div class="feature-icon"><i class="fas fa-fire"></i></div>
                <h3>热血不止</h3>
                <p>保持锋芒，奔赴下一场山海。</p>
            </div>
        </div>
        <div class="countdown-glow">
            <h3><i class="fas fa-hourglass-half"></i> 生日专属庆典计时器 <i class="fas fa-cake-candles"></i></h3>
            <div id="birthdayTimer" class="timer-digits">
                <div class="time-box">
                    <span class="time-number" id="days">00</span><br>天
                </div>
                <div class="time-box">
                    <span class="time-number" id="hours">00</span><br>时
                </div>
                <div class="time-box">
                    <span class="time-number" id="mins">00</span><br>分
                </div>
                <div class="time-box">
                    <span class="time-number" id="secs">00</span><br>秒
                </div>
            </div>
            <p style="margin-top: 18px;"><i class="fas fa-bolt"></i> 每一秒都为你闪耀 <i class="fas fa-sparkle"></i></p>
        </div>

        <div style="text-align: center; margin-top: 50px; padding: 20px;">
            <p style="letter-spacing: 1px; font-size: 1.1rem;">🎈 新的一岁，乘风破浪，世界因你而不同 🎈</p>
            <p style="font-size: 13px; margin-top: 12px;"><i class="fas fa-code-branch"></i> Z℮R∅零号</p>
        </div>
    </div>
    <div class="music-control">
        <div class="music-trigger" id="musicBtn">
            <i class="fas fa-play" id="musicIcon"></i>
        </div>
        <div class="volume-slider">
            <input type="range" id="volumeControl" min="0" max="1" step="0.05" value="0.4">
        </div>
    </div>

    <script src="sr-goto.js"></script>
</body>
</html>
