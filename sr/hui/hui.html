<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
<title>SUR1生日快乐</title>
    <link rel="stylesheet" href="sr.css">
    <link rel="icon" type="image/x-icon" href="../../images/cursor/正常选择.cur">
</head>
<body>
<div class="animated-bg"></div>
<div class="bg-glow"></div>
<canvas id="particleCanvas"></canvas>
<canvas id="fireworks-canvas"></canvas>

<div class="main-wrapper">
    <div class="hero-birthday animate-in">
        <div class="glow-text">✨ SUR1 ✨</div>
        <div class="glow-text" style="font-size: 3rem; margin-top: -8px;">HAPPY BIRTHDAY</div>
        <div class="subtitle-glow"><i class="fas fa-star-of-life"></i> 踏遍星海・自成锋芒 <i class="fas fa-meteor"></i></div>
    </div>
    <div class="birthday-card-container animate-in" style="animation-delay: 0.15s;">
        <div class="card-3d" id="flipCard">
            <div class="card-front">
                <div class="avatar-frame">
                    <i class="fas fa-crown"></i>
                </div>
                <h2>SUR1</h2>
                <p>✨ 今日主角 ✨</p>
                <div class="click-hint"><i class="fas fa-hand-point-right"></i> 轻点卡片 · 翻转惊喜 <i class="fas fa-gift"></i></div>
            </div>
            <div class="card-back">
                <div class="birthday-message">🎂 生日快乐 🎂</div>
                <div class="bless-detail">
                    愿你手握漫天璀璨星光<br>
                    所向皆坦途，所行皆荣光<br>
                    「Zero · 零号」<br>
                    💙 步履不停 锋芒尽现 💙
                </div>
                <i class="fas fa-gift" style="font-size: 48px; margin-top: 20px; opacity: 0.9;"></i>
            </div>
        </div>
    </div>
    <div class="surprise-grid">
        <div class="feature-card">
            <div class="feature-icon"></div>
            <h3>逐光而行</h3>
            <p>心怀滚烫理想，奔赴属于自己的浩瀚远方。</p>
        </div>
        <div class="feature-card">
            <div class="feature-icon"></div>
            <h3>锋芒自现</h3>
            <p>沉淀的力量，终会化作照亮前路的光。</p>
        </div>
        <div class="feature-card">
            <div class="feature-icon"></div>
            <h3>赤诚不改</h3>
            <p>保持心中热忱，奔赴下一场山海。</p>
        </div>
        <div class="feature-card">
            <div class="feature-icon"></div>
			<h3>万丈荣光</h3>
            <p>好运与实力相伴，续写崭新篇章。</p>
        </div>
    </div>
    <div class="countdown-glow">
        <h3><i class="fas fa-hourglass-half"></i> 生日专属庆典计时器 <i class="fas fa-cake-candles"></i></h3>
        <div id="birthdayTimer" class="timer-digits">
            <div class="time-box"><span class="time-number" id="days">00</span><br>天</div>
            <div class="time-box"><span class="time-number" id="hours">00</span><br>时</div>
            <div class="time-box"><span class="time-number" id="mins">00</span><br>分</div>
            <div class="time-box"><span class="time-number" id="secs">00</span><br>秒</div>
        </div>
        <p style="margin-top: 18px;"><i class="fas fa-bolt"></i> 每一秒都在为你喝彩 <i class="fas fa-sparkle"></i></p>
    </div>

    <div style="text-align: center; margin-top: 50px; padding: 20px;">
        <p style="letter-spacing: 1px;">🎈 新的一岁，光芒所至，万物生辉 🎈</p>
        <p style="font-size: 13px; margin-top: 12px;"><i class="fas fa-code-branch"></i> Z℮R∅零号</p>
    </div>
</div>

<div class="music-trigger" id="musicBtn">
    <i class="fas fa-play" id="musicIcon"></i>
</div>
<script src="sr.js"></script>
</body>
</html>
